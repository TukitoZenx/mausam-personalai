services:
  # FastAPI Single Backend Service for Render
  - type: web
    name: mausam-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mausam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mausam-redis
          property: connectionString
      - key: WEATHER_API_KEY
        sync: false
      - key: AQI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        sync: false

  # Managed Redis for Weather, AQI & Geocoding Caching
  - type: redis
    name: mausam-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  # Managed PostgreSQL Database with PostGIS support
  - name: mausam-db
    databaseName: mausam_db
    user: mausam_user
    region: oregon
    plan: free
    ipAllowList: []
